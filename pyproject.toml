version = "0.6.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/KunLnn/ComfyUI-Arbor"

[tool.comfy]
PublisherId = "kunlnn"
DisplayName = "Arbor"
Icon = ""
includes = ["example_media", "example_workflows", "locales", "web"]
requires-comfyui = ">=0.42.0"
